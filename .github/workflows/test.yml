name: Tests

on:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: classic-tests-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '@autotest') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Verify synchronized account files
        run: scripts/sync_account_module.sh --check

      - name: Test account sync updates
        run: python3 scripts/test_account_sync.py

      - name: Build
        run: make build

      - name: Run affected tests
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          suites=()
          while IFS= read -r path; do
            name="${path##*/}"
            case "$path" in
              Tests/TypefluxTests/*Tests.swift)
                [[ ! -f "$path" ]] || suites+=("${name%.swift}")
                ;;
              Sources/Typeflux/*.swift)
                suite="${name%.swift}Tests"
                [[ ! -f "Tests/TypefluxTests/$suite.swift" ]] || suites+=("$suite")
                ;;
            esac

            # Cover shared entry points that do not have a same-named test file.
            case "$path" in
              */TypefluxCloudRequestHeaders.swift | */CloudRequestExecutor.swift)
                suites+=(TypefluxCloudRequestHeadersTests TypefluxOfficialTranscriberTests AppAnalyticsReporterTests)
                ;;
              */AutoUpdater.swift | app/Info.plist)
                suites+=(AutoUpdateArchiveInstallerTests)
                ;;
              Package.swift | Package.resolved | .github/workflows/test.yml)
                suites+=(TypefluxCloudRequestHeadersTests TypefluxOfficialTranscriberTests AppAnalyticsReporterTests)
                suites+=(AutoUpdateArchiveInstallerTests FileHistoryStoreTests SQLiteHistoryStoreTests)
                ;;
            esac
          done <<< "$changed_files"

          if grep -Fxq UPSTREAM_ACCOUNT_SYNC <<< "$changed_files"; then
            while IFS= read -r path; do
              [[ "$path" == Tests/* ]] || continue
              while read -r suite; do
                suites+=("$suite")
              done < <(sed -En 's/.*(class|struct) ([A-Za-z0-9_]+Tests)[ :{].*/\2/p' "$path")
            done < scripts/account_module_files.txt
          fi

          if [[ -z "${suites[0]:-}" ]]; then
            echo "No affected test suites selected."
            exit 0
          fi
          filter="$(printf '%s\n' "${suites[@]}" | sort -u | paste -sd '|' -)"
          make test FILTER="$filter"
